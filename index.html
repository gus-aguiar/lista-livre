<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Crie listas de exercícios com questões reais do ENEM. Busque por assunto, arraste, organize e imprima. Gratuito e open source."
    />
    <title>Lista Livre · Questões que se conectam</title>
    <script>
      (() => {
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          const saved = localStorage.getItem("lista-livre-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#171120" : "#6d28d9";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
